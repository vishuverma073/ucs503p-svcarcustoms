name: CI

# Root-level CI for the monorepo. GitHub only reads workflows from the repo
# root, so the old svcar-api/.github/workflows/ci.yml never ran.
# The build talks to no API: without NEXT_PUBLIC_API_URL it targets
# localhost:8787 and pages fall back, so CI never touches production.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (svcar-api)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: svcar-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: svcar-api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @svcar/contracts build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  storefront:
    name: Storefront (svcar-india)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: svcar-india
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: svcar-india/package-lock.json
      # Same install as Vercel. `npm ci` rejects the current lockfile on Linux
      # (optional peer deps webpack/esbuild missing); regenerate the lockfile in a
      # separate PR, then switch back to `npm ci`.
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Lint (report only — 13 pre-existing errors on main)
        run: npm run lint
        continue-on-error: true

  brand:
    name: Brand config in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/apply-brand.ts --check
